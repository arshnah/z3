<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#07060b" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			// The OS title bar is hidden (see electron/main.ts) and the app draws
			// its own window chrome. Record the platform before first paint so
			// top bars can leave room for the native window buttons: macOS keeps
			// its traffic lights on the left, Windows and Linux draw theirs on the
			// right.
			document.documentElement.dataset.os = /Mac|iPhone|iPad/.test(navigator.userAgent)
				? "mac"
				: /Windows/.test(navigator.userAgent)
					? "win"
					: "linux";
		</script>
		<div id="shell">%sveltekit.body%</div>
	</body>
</html>
